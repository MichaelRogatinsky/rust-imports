name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0

      - name: Verify release tag
        run: |
          bun -e '
            const { version } = await Bun.file("package.json").json();
            const expected = `v${version}`;
            if (process.env.GITHUB_REF_NAME !== expected) {
              console.error(`Release tag ${process.env.GITHUB_REF_NAME} does not match ${expected}`);
              process.exit(1);
            }
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              console.error("Prerelease versions need an explicit npm dist-tag policy");
              process.exit(1);
            }
          '

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: git diff --exit-code -- dist
      - run: bun run smoke:pack

      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
